# Explicit build plan for Railway/Nixpacks. Without this the builder infers
# the toolchain, which can pick a Node version Next 14 does not support.
providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
